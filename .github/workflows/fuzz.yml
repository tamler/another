name: fuzz

# libFuzzer runs of every target in fuzz/ (nightly Rust). The same harnesses run on
# stable in every `cargo test` through crates/another-fuzz/tests/smoke.rs; this job
# explores far more inputs. A crash uploads the failing input as an artifact.
on:
  pull_request:
    branches: [main]
    paths:
      - "crates/**"
      - "fuzz/**"
      - "Cargo.lock"
      - ".github/workflows/fuzz.yml"
  push:
    branches: [main]
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:
    inputs:
      seconds:
        description: "Seconds per target"
        default: "60"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  fuzz:
    name: fuzz (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        target: [ingest_events, ingest_raw, peer_request, tool_args, cli_args]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@6a52aad76a94a5fbc50d567bb5be24419801c1fb # nightly

      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: fuzz

      - name: Install cargo-fuzz
        # 0.12.0's locked dependencies no longer build on current nightly.
        run: cargo install cargo-fuzz --version 0.13.2 --locked

      - name: Run ${{ matrix.target }}
        working-directory: fuzz
        env:
          SECONDS_INPUT: ${{ github.event_name == 'pull_request' && '300' || inputs.seconds || '60' }}
          TARGET: ${{ matrix.target }}
        run: |
          secs="$SECONDS_INPUT"
          case "$secs" in
            ''|*[!0-9]*) echo "seconds must be a whole number" >&2; exit 2 ;;
          esac
          cargo fuzz run "$TARGET" -- -max_total_time="$secs" -rss_limit_mb=4096

      - name: Upload crash input
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fuzz-${{ matrix.target }}-artifacts
          path: fuzz/artifacts/
