name: fuzz

# Short libFuzzer runs of every target in fuzz/ (nightly). The same harnesses run on
# stable in every `cargo test` through crates/another-fuzz/tests/smoke.rs; this job
# explores far more inputs. A crash uploads the failing input as an artifact.
on:
  pull_request:
    branches: [main]
    paths:
      - "crates/**"
      - "fuzz/**"
      - "Cargo.lock"
      - ".github/workflows/fuzz.yml"
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:
    inputs:
      seconds:
        description: "Seconds per target"
        default: "60"

env:
  CARGO_TERM_COLOR: always

jobs:
  fuzz:
    name: fuzz (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [ingest_events, ingest_raw, peer_request, tool_args, cli_args]
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@nightly

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --version 0.12.0 --locked

      - name: Run ${{ matrix.target }}
        working-directory: fuzz
        env:
          SECONDS_INPUT: ${{ github.event.inputs.seconds }}
          TARGET: ${{ matrix.target }}
        run: |
          secs="${SECONDS_INPUT:-60}"
          case "$secs" in
            ''|*[!0-9]*) echo "seconds must be a whole number" >&2; exit 2 ;;
          esac
          cargo fuzz run "$TARGET" -- -max_total_time="$secs" -rss_limit_mb=4096

      - name: Upload crash input
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-${{ matrix.target }}-artifacts
          path: fuzz/artifacts/
