name: fuzz

# libFuzzer runs of every target in fuzz/ (nightly Rust). The same harnesses run on
# stable in every `cargo test` through crates/another-fuzz/tests/smoke.rs; this job
# explores far more inputs. A crash uploads the failing input as an artifact.
on:
  pull_request:
    branches: [main]
    paths:
      - "crates/**"
      - "fuzz/**"
      - "Cargo.lock"
      - ".github/workflows/fuzz.yml"
  push:
    branches: [main]
    paths:
      - "crates/**"
      - "fuzz/**"
      - "Cargo.lock"
      - ".github/workflows/fuzz.yml"
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:
    inputs:
      seconds:
        description: "Seconds per target (whole number from 1 to 1800)"
        type: string
        default: "300"

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  fuzz:
    name: fuzz (${{ matrix.target }})
    runs-on: ubuntu-latest
    # Allow up to 30 minutes of fuzzing plus setup for manual overrides.
    timeout-minutes: ${{ github.event_name == 'pull_request' && 15 || (github.event_name == 'workflow_dispatch' && inputs.seconds != '300' && 40 || 30) }}
    strategy:
      fail-fast: false
      matrix:
        target: [ingest_events, ingest_raw, peer_request, tool_args, cli_args]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@6a52aad76a94a5fbc50d567bb5be24419801c1fb # nightly

      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: fuzz

      - name: Install cargo-fuzz
        # 0.12.0's locked dependencies no longer build on current nightly.
        run: cargo install cargo-fuzz --version 0.13.2 --locked

      - name: Run ${{ matrix.target }}
        working-directory: fuzz
        env:
          EVENT_NAME: ${{ github.event_name }}
          SECONDS_INPUT: ${{ inputs.seconds }}
          TARGET: ${{ matrix.target }}
        run: |
          case "$EVENT_NAME" in
            pull_request) secs=60 ;;
            workflow_dispatch) secs="$SECONDS_INPUT" ;;
            *) secs=300 ;;
          esac
          if [[ ! "$secs" =~ ^0*([1-9][0-9]{0,3})$ ]] || (( BASH_REMATCH[1] > 1800 )); then
            echo "seconds must be a whole number from 1 to 1800" >&2
            exit 2
          fi
          secs="${BASH_REMATCH[1]}"
          cargo fuzz run "$TARGET" -- -max_total_time="$secs" -rss_limit_mb=4096

      - name: Upload crash input
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fuzz-${{ matrix.target }}-artifacts
          path: fuzz/artifacts/
