name: dependency security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '23 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: cargo ${{ matrix.tool }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - tool: audit
            version: 0.23.0
          - tool: deny
            version: 0.22.1
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Isolate scanner state
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/security-home" "$RUNNER_TEMP/another" "$RUNNER_TEMP/security-target"
          echo "HOME=$RUNNER_TEMP/security-home" >> "$GITHUB_ENV"
          echo "ANOTHER_HOME=$RUNNER_TEMP/another" >> "$GITHUB_ENV"
          echo "CARGO_HOME=$RUNNER_TEMP/security-home/.cargo" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_DIR=$RUNNER_TEMP/security-target" >> "$GITHUB_ENV"
          echo "RUSTUP_HOME=${RUSTUP_HOME:-$HOME/.rustup}" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/security-home/.cargo/bin" >> "$GITHUB_PATH"

      - name: Install scanner toolchain
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable (2026-11-27)
        with:
          toolchain: 1.96.0

      - name: Install pinned scanner
        run: cargo install --locked --version '${{ matrix.version }}' 'cargo-${{ matrix.tool }}'

      - name: Fetch RustSec database for cargo audit
        if: matrix.tool == 'audit'
        shell: bash
        run: |
          if ! cargo audit update-db; then
            echo '::error::cargo audit could not fetch the RustSec advisory database; security scanning cannot continue.'
            exit 1
          fi

      - name: Populate crates.io cache for yanked-crate checks
        if: matrix.tool == 'audit'
        run: cargo fetch --locked

      - name: cargo audit
        if: matrix.tool == 'audit'
        run: cargo audit --no-fetch --deny warnings

      - name: Fetch RustSec database for cargo deny
        if: matrix.tool == 'deny'
        shell: bash
        run: |
          if ! cargo deny --locked --all-features fetch db; then
            echo '::error::cargo deny could not fetch the RustSec advisory database; security scanning cannot continue.'
            exit 1
          fi

      - name: cargo deny
        if: matrix.tool == 'deny'
        run: cargo deny --locked --all-features check
