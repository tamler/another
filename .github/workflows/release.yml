name: release

# Builds another for macOS, static musl Linux, and Windows.
# - Tag `vX.Y.Z` pushes build and publish a GitHub Release with archives + SHA-256 sums.
# - Pull requests that touch this workflow, and manual runs, build only (artifacts kept 7 days).

on:
  push:
    tags: ["v*"]
  pull_request:
    paths: [".github/workflows/release.yml"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
            smoke: true
          - target: x86_64-apple-darwin
            os: macos-15-intel
            smoke: true
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            smoke: true
            musl: true
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            smoke: true
            exe: .exe
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
            smoke: true
            musl: true
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          targets: ${{ matrix.target }}

      - name: Check tag matches crate version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          crate_version=$(cargo pkgid -p another | sed 's/.*[#@]//')
          if [[ "$crate_version" != "$version" ]]; then
            echo "tag $GITHUB_REF_NAME does not match the crate version $crate_version" >&2
            exit 1
          fi

      - name: Install musl tools
        if: matrix.musl
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }} -p another

      - name: Smoke test
        if: matrix.smoke
        shell: bash
        run: |
          bin=target/${{ matrix.target }}/release/another${{ matrix.exe }}
          "$bin" --version
          home=$(mktemp -d)
          trap 'rm -rf "$home"' EXIT
          if [[ "$RUNNER_OS" == Windows ]]; then
            home_for_binary=$(cygpath -aw "$home")
          else
            home_for_binary="$home"
          fi
          ANOTHER_HOME="$home_for_binary" "$bin" --json init > /dev/null
          ANOTHER_HOME="$home_for_binary" "$bin" agent register smoke --program other > /dev/null

      - name: Check the Linux binary is static
        if: matrix.musl
        shell: bash
        run: |
          info=$(file "target/${{ matrix.target }}/release/another")
          echo "$info"
          grep -Eq 'statically linked|static-pie linked' <<< "$info"

      - name: Package
        if: runner.os != 'Windows'
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="dev"
          fi
          name="another-${version}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp "target/${{ matrix.target }}/release/another" "dist/$name/"
          # Apache-2.0 section 4(d): redistributions carry the NOTICE file.
          cp LICENSE NOTICE README.md "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          (cd dist && shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256")
          # Check what will be published, the way docs/VERIFY.md tells users to.
          (cd dist && shasum -a 256 -c "$name.tar.gz.sha256")
          expected=$(printf '%s\n' "$name/" "$name/LICENSE" "$name/NOTICE" "$name/README.md" "$name/another" | sort)
          actual=$(tar -tzf "dist/$name.tar.gz" | sort)
          if [[ "$actual" != "$expected" ]]; then
            printf 'unexpected archive contents:\n%s\n' "$actual" >&2
            exit 1
          fi
          ls -l dist

      - name: Package Windows zip
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          TARGET: ${{ matrix.target }}
        run: |
          $version = 'dev'
          if ($env:GITHUB_REF.StartsWith('refs/tags/v')) {
            $version = $env:GITHUB_REF_NAME.Substring(1)
          }
          $name = "another-$version-$env:TARGET"
          $archive = "$name.zip"
          New-Item -ItemType Directory -Path "dist/$name" | Out-Null
          Copy-Item "target/$env:TARGET/release/another.exe", LICENSE, NOTICE, README.md "dist/$name/"
          Compress-Archive -Path "dist/$name" -DestinationPath "dist/$archive"
          $digest = (Get-FileHash -Algorithm SHA256 "dist/$archive").Hash.ToLowerInvariant()
          Set-Content -LiteralPath "dist/$archive.sha256" -Value "${digest}  ${archive}`n" -Encoding ascii -NoNewline
          $zip = [IO.Compression.ZipFile]::OpenRead("dist/$archive")
          try {
            $expected = @('LICENSE', 'NOTICE', 'README.md', 'another.exe') | ForEach-Object { "$name/$_" }
            $actual = $zip.Entries.FullName | Where-Object { $_ -ne "$name/" }
            if (Compare-Object $expected $actual -CaseSensitive) {
              throw "Unexpected archive contents: $actual"
            }
          } finally {
            $zip.Dispose()
          }

      - name: Package the install script
        if: matrix.target == 'x86_64-unknown-linux-musl'
        shell: bash
        run: |
          sh -n scripts/install.sh
          cp scripts/install.sh dist/install.sh

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: another-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
            dist/install.sh
          retention-days: 7
          if-no-files-found: error

  publish:
    name: publish GitHub Release
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          path: dist
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test -s dist/install.sh
          ls -l dist
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Another $GITHUB_REF_NAME" \
            --notes 'See the [Another changelog](https://toanother.one/changelog/).' \
            --generate-notes
