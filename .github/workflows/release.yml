name: release

# Builds another for macOS (arm64, x86_64) and Linux (static musl: x86_64, arm64).
# - Tag `vX.Y.Z` pushes build and publish a GitHub Release with archives, per-archive .sha256
#   files, one SHA256SUMS and install.sh (one-line install:
#   curl -fsSL https://github.com/tamler/another/releases/latest/download/install.sh | sh).
# - Pull requests that touch this workflow, and manual runs, build only (artifacts kept 7 days).

on:
  push:
    tags: ["v*"]
  pull_request:
    paths: [".github/workflows/release.yml", "scripts/install.sh"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
            smoke: true
          - target: x86_64-apple-darwin
            os: macos-latest
            smoke: false
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            smoke: true
            musl: true
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
            smoke: true
            musl: true
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl tools
        if: matrix.musl
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }} -p another

      - name: Smoke test
        if: matrix.smoke
        shell: bash
        run: |
          bin=target/${{ matrix.target }}/release/another
          "$bin" --version
          home=$(mktemp -d)
          ANOTHER_HOME="$home" "$bin" --json init > /dev/null
          ANOTHER_HOME="$home" "$bin" agent register smoke --program other > /dev/null

      - name: Package
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then version="${GITHUB_REF_NAME#v}"; else version="dev"; fi
          name="another-${version}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp "target/${{ matrix.target }}/release/another" "dist/$name/"
          cp LICENSE README.md "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          (cd dist && shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256")
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: another-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
          retention-days: 7
          if-no-files-found: error

  publish:
    name: publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: actions/checkout@v4
        with:
          path: src
          sparse-checkout: scripts

      - name: Checksums and install script
        run: |
          # One SHA256SUMS for every archive (what install.sh verifies against), plus the
          # per-archive .sha256 files and the install script itself.
          (cd dist && cat *.tar.gz.sha256 | sort -k2 > SHA256SUMS && sha256sum -c SHA256SUMS)
          cp src/scripts/install.sh dist/install.sh
          ls -l dist

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l dist
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Another $GITHUB_REF_NAME" \
            --generate-notes
