name: release

# Builds another for macOS (arm64, x86_64) and Linux (static musl: x86_64, arm64).
# - Tag `vX.Y.Z` pushes build and publish a GitHub Release with archives + SHA-256 sums.
# - Pull requests that touch this workflow, and manual runs, build only (artifacts kept 7 days).

on:
  push:
    tags: ["v*"]
  pull_request:
    paths: [".github/workflows/release.yml"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
            smoke: true
          - target: x86_64-apple-darwin
            os: macos-latest
            smoke: false
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            smoke: true
            musl: true
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
            smoke: true
            musl: true
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Check tag matches crate version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          crate_version=$(cargo pkgid -p another | sed 's/.*[#@]//')
          if [[ "$crate_version" != "$version" ]]; then
            echo "tag $GITHUB_REF_NAME does not match the crate version $crate_version" >&2
            exit 1
          fi

      - name: Install Rust
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl tools
        if: matrix.musl
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }} -p another

      - name: Smoke test
        if: matrix.smoke
        shell: bash
        run: |
          bin=target/${{ matrix.target }}/release/another
          "$bin" --version
          home=$(mktemp -d)
          ANOTHER_HOME="$home" "$bin" --json init > /dev/null
          ANOTHER_HOME="$home" "$bin" agent register smoke --program other > /dev/null

      - name: Check the Linux binary is static
        if: matrix.musl
        shell: bash
        run: |
          info=$(file "target/${{ matrix.target }}/release/another")
          echo "$info"
          grep -Eq 'statically linked|static-pie linked' <<< "$info"

      - name: Package
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="dev"
          fi
          name="another-${version}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp "target/${{ matrix.target }}/release/another" "dist/$name/"
          # Apache-2.0 section 4(d): redistributions carry the NOTICE file.
          cp LICENSE NOTICE README.md "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          (cd dist && shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256")
          # Check what will be published, the way docs/VERIFY.md tells users to.
          (cd dist && shasum -a 256 -c "$name.tar.gz.sha256")
          expected=$(printf '%s\n' "$name/" "$name/LICENSE" "$name/NOTICE" "$name/README.md" "$name/another" | sort)
          actual=$(tar -tzf "dist/$name.tar.gz" | sort)
          if [[ "$actual" != "$expected" ]]; then
            printf 'unexpected archive contents:\n%s\n' "$actual" >&2
            exit 1
          fi
          ls -l dist

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: another-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
          retention-days: 7
          if-no-files-found: error

  publish:
    name: publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          path: dist
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l dist
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Another $GITHUB_REF_NAME" \
            --generate-notes
