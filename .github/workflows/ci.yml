name: ci

on:
  push:
    branches: [main]
  # Every pull request, including stacked ones that target another branch.
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: test / clippy / fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: cargo test
        run: cargo test --all-features

      - name: install script
        run: |
          sh -n scripts/install.sh
          shellcheck -S warning scripts/install.sh

  msrv:
    name: msrv (Rust 1.88)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust 1.88
        uses: dtolnay/rust-toolchain@1.88

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: cargo check
        run: cargo check --workspace --all-targets --locked

  docs:
    name: docs (quickstart, walkthrough, coverage)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build another
        run: cargo build --locked -p another

      - name: Every command, MCP tool and HTTP route is documented
        env:
          ANOTHER_BIN: ${{ github.workspace }}/target/debug/another
        run: python3 scripts/gen-docs.py --check

      - name: README quickstart, verbatim, as a new user
        env:
          ANOTHER_BIN: ${{ github.workspace }}/target/debug/another
        run: |
          shellcheck -S warning scripts/quickstart-ci.sh
          sh scripts/quickstart-ci.sh

      - name: Peer-only walkthrough, verbatim
        run: |
          export PATH="$GITHUB_WORKSPACE/target/debug:$PATH"
          cd "$(mktemp -d)"
          python3 "$GITHUB_WORKSPACE/scripts/run-doc-commands.py" "$GITHUB_WORKSPACE/docs/PEER-WALKTHROUGH.md" "## Run it" "## What you didn't need"
