name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  copy:
    name: copy lint
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Copy lint self-test
        run: python3 scripts/check-copy.py --self-test
      - name: Copy lint
        run: python3 scripts/check-copy.py

  # An unlocked `cargo install --git` resolves from scratch and reads no project config, so
  # neither the lockfile nor `.cargo/config.toml` can protect it. Cargo finds config from the
  # current directory, so resolving from outside the checkout matches that.
  msrv-fresh-resolve:
    name: msrv (Rust 1.88, fresh resolve)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install Rust 1.88
        uses: dtolnay/rust-toolchain@5445741acf05630efa19e221cc588ebe0842b13d # 1.88

      - name: Resolve from scratch
        working-directory: ${{ runner.temp }}
        run: cargo generate-lockfile --manifest-path "$GITHUB_WORKSPACE/Cargo.toml"

      - name: cargo check
        run: cargo check --workspace --all-targets --locked

  check:
    name: test / clippy / fmt
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo check (default features)
        run: cargo check -p another --locked

      - name: cargo clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      # wake_e2e drives a real tmux server on a private socket.
      - name: Install tmux
        run: command -v tmux || (sudo apt-get update && sudo apt-get install -y tmux)

      - name: cargo test
        run: cargo test --all-features

      - name: dashboard render test
        run: |
          npm install --prefix "$RUNNER_TEMP/dash-ui" jsdom
          DASH_UI_NODE_MODULES="$RUNNER_TEMP/dash-ui/node_modules" node crates/another/src/dashboard/assets/render.test.mjs

  msrv:
    name: msrv (Rust 1.88)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install Rust 1.88
        uses: dtolnay/rust-toolchain@5445741acf05630efa19e221cc588ebe0842b13d # 1.88

      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: cargo check
        run: cargo check --workspace --all-targets --locked
