# Optional Herdr plugin for Another. Install with:
#   herdr plugin install tamler/another/integrations/herdr
# or, from a local checkout:
#   herdr plugin link /path/to/another/integrations/herdr
id = "another.inbox"
name = "Another: agent coordination"
version = "0.1.0"
min_herdr_version = "0.7.0"
description = "Wake Herdr agents that have unread mail in Another, and show the Another activity feed in a pane."
platforms = ["linux", "macos"]

[[actions]]
id = "wake-agents"
title = "Another: wake agents with unread mail"
contexts = ["workspace"]
command = ["sh", "another-herdr.sh", "wake"]

[[actions]]
id = "inbox-digest"
title = "Another: activity summary (last hour)"
contexts = ["workspace"]
command = ["sh", "another-herdr.sh", "summary"]

[[panes]]
id = "activity"
title = "Another: activity"
placement = "split"
command = ["sh", "another-herdr.sh", "activity"]
