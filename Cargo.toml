[workspace]
# "3" keeps every fresh resolve within `rust-version`, including `cargo install --git`,
# which reads this file but not the lockfile or `.cargo/config.toml`.
resolver = "3"
members = ["crates/another-core", "crates/another"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/tamler/another"
rust-version = "1.88"

[workspace.dependencies]
another-core = { path = "crates/another-core" }
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
rusqlite = { version = "0.39", features = ["bundled", "backup", "hooks", "limits"] }
ulid = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
globset = "0.4"
sha2 = "0.10"
ring = "0.17"
getrandom = "0.3"
ed25519-dalek = "2"
base64 = "0.22"
ureq = { version = "3", features = ["json"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time", "io-std", "net", "sync"] }
tokio-stream = "0.1"
tokio-util = "0.7"
rmcp = { version = "3.8", features = ["server", "macros", "schemars", "transport-io", "transport-streamable-http-server"] }
schemars = "1"
axum = "0.8"
clap = { version = "4", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tempfile = "3"
libc = "0.2"

[profile.release]
strip = true

# Debug and test builds optimize the signature and hash crates. The identity scan's 2 s
# deadline (D65) verifies one Ed25519 signature per session binding; unoptimized curve
# arithmetic made that scan about seven times slower than the release binary, so debug
# tests on slower CI runners measured a cost no shipped build has.
[profile.dev.package.curve25519-dalek]
opt-level = 3

[profile.dev.package.ed25519-dalek]
opt-level = 3

[profile.dev.package.sha2]
opt-level = 3
