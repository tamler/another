[workspace]
# "3" keeps every fresh resolve within `rust-version`, including `cargo install --git`,
# which reads this file but not the lockfile or `.cargo/config.toml`.
resolver = "3"
members = ["crates/another-core", "crates/another", "crates/another-fuzz"]
# `fuzz/` (cargo-fuzz, nightly) depends on crates/another-fuzz but is its own workspace.
exclude = ["fuzz"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/tamler/another"
rust-version = "1.89"

[workspace.dependencies]
another-core = { path = "crates/another-core" }
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
rusqlite = { version = "0.43", features = ["bundled"] }
ulid = "1"
# Timestamps only (no time zone data); rmcp already depends on jiff with these features.
jiff = { version = "1", default-features = false, features = ["std"] }
globset = "0.4"
sha2 = "0.10"
getrandom = "0.3"
ed25519-dalek = "2"
base64 = "0.22"
# The URI type the HTTP client and server already use; the core parses a hub address with it.
http = "1"
ureq = { version = "3", features = ["json"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time", "io-std", "net", "sync"] }
tokio-stream = "0.1"
tokio-util = "0.7"
# 3.9 fixes RUSTSEC-2026-0462. Default features minus `chrono` (unmaintained, RUSTSEC-2026-0543),
# which only adds `Annotations::for_resource`; the `lastModified` wire field is a string either way.
rmcp = { version = "3.9", default-features = false, features = ["base64", "server", "macros", "schemars", "transport-io", "transport-streamable-http-server"] }
schemars = "1"
axum = "0.8"
clap = { version = "4", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tempfile = "3"

[profile.release]
strip = true
