[package]
name = "another"
description = "Another: background messaging and coordination for coding agents"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "another"
path = "src/main.rs"

[dependencies]
another-core.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-stream.workspace = true
tokio-util.workspace = true
rmcp.workspace = true
schemars.workspace = true
axum.workspace = true
ureq.workspace = true
base64.workspace = true
clap.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[target.'cfg(unix)'.dependencies]
# One call, `geteuid`: the transports config is refused unless the user running Another owns it.
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Threading"] }

[features]
# Older unsigned federation nodes for compatibility tests. Off in shipped builds.
test-support = ["another-core/test-support"]

[dev-dependencies]
another = { path = ".", features = ["test-support"] }
# Upgrade tests build a home as an earlier build left it.
another-core = { workspace = true, features = ["test-support"] }
reqwest = { version = "0.13", default-features = false }
# Hook tests hold a SQLite write lock to verify bounded admission refusal.
rusqlite.workspace = true
tempfile.workspace = true
rmcp = { workspace = true, features = ["client", "transport-streamable-http-client-reqwest"] }
